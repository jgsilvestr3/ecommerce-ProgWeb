<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragmento/tema-inicial :: tema-inicial}"></th:block>
    <title>ShopHub</title>

    <link rel="stylesheet" th:href="@{/css/shophub.css}">
</head>

<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">

    <!-- Barra superior -->
    <header th:replace="~{fragmento/navbar :: navbar}"></header>

    <!-- Conteúdo principal -->
    <main id="conteudo" class="conteudo">

        <!-- Categorias carregadas do banco de dados -->
        <aside class="barra-categorias">
            <h2>Categorias</h2>

            <!-- Mostra todos os produtos e limpa os filtros -->
            <a class="categoria"
               th:classappend="${categoriaSelecionada == null} ? ' selecionada' : ''"
               th:href="@{/}">
                Todas as categorias
            </a>

            <!-- Cada categoria filtra os produtos correspondentes -->
            <a class="categoria"
               th:each="categoria : ${categorias}"
               th:classappend="${categoriaSelecionada != null and categoriaSelecionada.equals(categoria.id)} ? ' selecionada' : ''"
               th:href="@{/(categoriaId=${categoria.id}, busca=${busca})}"
               th:text="${categoria.nome}">
                Nome da categoria
            </a>
        </aside>

        <!-- Pesquisa e produtos -->
        <section class="area-produtos">

            <!-- Envia a pesquisa ao HomeController -->
            <form class="area-pesquisa" th:action="@{/}" method="get">

                <!-- Mantém o texto pesquisado após atualizar a página -->
                <input
                    type="text"
                    name="busca"
                    placeholder="Buscar produtos..."
                    aria-label="Buscar produtos"
                    th:value="${busca}">

                <!-- Preserva a categoria selecionada durante a pesquisa -->
                <input
                    type="hidden"
                    name="categoriaId"
                    th:value="${categoriaSelecionada}">

                <button type="submit">Pesquisar</button>
            </form>

            <h1 class="titulo-produtos">Nossos produtos</h1>

            <!-- Apresenta os produtos encontrados -->
            <div class="grade-produtos"
                 th:if="${!#lists.isEmpty(produtos)}">

                <article class="produto" th:each="produto : ${produtos}">

                    <div class="imagem-produto">
                        <img th:if="${!#strings.isEmpty(produto.imagem)}"
                             th:src="@{${produto.imagem}}"
                             th:alt="${produto.nome}">
                        <img th:if="${#strings.isEmpty(produto.imagem)}"
                             th:src="@{/images/produtos/sem-imagem.svg}"
                             th:alt="${produto.nome}">
                    </div>

                    <h3 th:text="${produto.nome}">
                        Nome do produto
                    </h3>

                    <p class="descricao"
                       th:text="${produto.descricao}">
                        Descrição do produto
                    </p>

                    <p class="preco">
                        R$
                        <span th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">
                            49,90
                        </span>
                    </p>

                    <p class="estoque"
                       th:if="${produto.estoque != null and produto.estoque > 0}">
                        Em estoque
                    </p>

                    <p class="estoque"
                       th:if="${produto.estoque == null or produto.estoque <= 0}">
                        Indisponível
                    </p>
                    <button type="button" class="btn-add-carrinho"
                            th:disabled="${produto.estoque <= 0}"
                            th:attr="data-id=${produto.id},data-nome=${produto.nome},data-preco=${produto.preco},data-estoque=${produto.estoque}">
                        Adicionar ao carrinho
                    </button>

                </article>
            </div>

            <!-- Mensagem caso nenhum produto corresponda aos filtros -->
            <p class="sem-produtos"
               th:if="${#lists.isEmpty(produtos)}">
                Nenhum produto encontrado. Tente outra pesquisa ou categoria.
            </p>

        </section>
    </main>

    <footer th:replace="~{fragmento/rodape :: rodape}"></footer>

</body>
</html>
