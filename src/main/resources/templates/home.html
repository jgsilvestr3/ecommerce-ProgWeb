
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub</title>

    <link rel="stylesheet" th:href="@{/css/shophub.css}">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            color: #222;
        }

        /* Barra superior */
        .barra-superior {
            min-height: 75px;
            padding: 0 5%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px #00000012;
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .menu a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
        }

        .menu a:hover {
            color: #2563eb;
        }

        /* Conteúdo abaixo da barra superior */
        .conteudo {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            padding: 30px 5%;
        }

        /* Categorias à esquerda */
        .barra-categorias {
            width: 230px;
            min-width: 230px;
            padding: 22px;
            background-color: white;
            border-radius: 10px;
        }

        .barra-categorias h2 {
            margin-top: 0;
            font-size: 19px;
        }

        .categoria {
            display: block;
            padding: 12px 10px;
            margin-top: 5px;
            color: #444;
            text-decoration: none;
            border-radius: 6px;
        }

        .categoria:hover,
        .categoria.selecionada {
            background-color: #eff6ff;
            color: #2563eb;
        }

        /* Área principal */
        .area-produtos {
            flex: 1;
            min-width: 0;
        }

        /* Pesquisa acima dos produtos */
        .area-pesquisa {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .area-pesquisa input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .area-pesquisa button {
            padding: 0 24px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        .area-pesquisa button:hover {
            background-color: #1d4ed8;
        }

        .titulo-produtos {
            margin: 0 0 20px;
            font-size: 23px;
        }

        /* Grade de produtos */
        .grade-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        .produto {
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000a;
        }

        .imagem-produto {
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            background-color: #f1f5f9;
            border-radius: 8px;
            font-size: 48px;
        }

        .produto h3 {
            margin: 0 0 10px;
            font-size: 17px;
        }

        .descricao {
            min-height: 36px;
            color: #666;
            font-size: 14px;
        }

        .preco {
            margin: 15px 0 8px;
            color: #2563eb;
            font-size: 21px;
            font-weight: bold;
        }

        .estoque {
            color: #666;
            font-size: 13px;
        }

        .sem-produtos {
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            color: #666;
        }

        /* Ajuste para telas menores */
        @media (max-width: 700px) {
            .barra-superior {
                padding: 20px;
                align-items: flex-start;
                gap: 18px;
                flex-direction: column;
            }

            .menu {
                gap: 16px;
                flex-wrap: wrap;
            }

            .conteudo {
                padding: 20px;
                flex-direction: column;
            }

            .barra-categorias {
                width: 100%;
                min-width: 0;
            }

            .area-pesquisa button {
                padding: 0 14px;
            }
        }
    
        /* ---- botão do carrinho (acrescentado na integração) ---- */
        .btn-add-carrinho { width: 100%; margin-top: 10px; padding: 10px 14px; border: none; border-radius: 6px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer; }
        .btn-add-carrinho:hover { background: #1d4ed8; }
        .btn-add-carrinho:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>

<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">

    <!-- Barra superior -->
    <header th:replace="~{fragmento/navbar :: navbar}"></header>

    <!-- Conteúdo principal -->
    <main id="conteudo" class="conteudo">

        <!-- Categorias carregadas do banco de dados -->
        <aside class="barra-categorias">
            <h2>Categorias</h2>

            <!-- Mostra todos os produtos e limpa os filtros -->
            <a class="categoria"
               th:classappend="${categoriaSelecionada == null} ? ' selecionada' : ''"
               th:href="@{/}">
                Todas as categorias
            </a>

            <!-- Cada categoria filtra os produtos correspondentes -->
            <a class="categoria"
               th:each="categoria : ${categorias}"
               th:classappend="${categoriaSelecionada != null and categoriaSelecionada.equals(categoria.id)} ? ' selecionada' : ''"
               th:href="@{/(categoriaId=${categoria.id}, busca=${busca})}"
               th:text="${categoria.nome}">
                Nome da categoria
            </a>
        </aside>

        <!-- Pesquisa e produtos -->
        <section class="area-produtos">

            <!-- Envia a pesquisa ao HomeController -->
            <form class="area-pesquisa" th:action="@{/}" method="get">

                <!-- Mantém o texto pesquisado após atualizar a página -->
                <input
                    type="text"
                    name="busca"
                    placeholder="Buscar produtos..."
                    aria-label="Buscar produtos"
                    th:value="${busca}">

                <!-- Preserva a categoria selecionada durante a pesquisa -->
                <input
                    type="hidden"
                    name="categoriaId"
                    th:value="${categoriaSelecionada}">

                <button type="submit">Pesquisar</button>
            </form>

            <h1 class="titulo-produtos">Nossos produtos</h1>

            <!-- Apresenta os produtos encontrados -->
            <div class="grade-produtos"
                 th:if="${!#lists.isEmpty(produtos)}">

                <article class="produto" th:each="produto : ${produtos}">

                    <div class="imagem-produto" aria-hidden="true">🛍️</div>

                    <h3 th:text="${produto.nome}">
                        Nome do produto
                    </h3>

                    <p class="descricao"
                       th:text="${produto.descricao}">
                        Descrição do produto
                    </p>

                    <p class="preco">
                        R$
                        <span th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">
                            49,90
                        </span>
                    </p>

                    <p class="estoque"
                       th:if="${produto.estoque != null and produto.estoque > 0}">
                        Em estoque
                    </p>

                    <p class="estoque"
                       th:if="${produto.estoque == null or produto.estoque <= 0}">
                        Indisponível
                    </p>
                    <button type="button" class="btn-add-carrinho"
                            th:disabled="${produto.estoque <= 0}"
                            th:attr="data-id=${produto.id},data-nome=${produto.nome},data-preco=${produto.preco},data-estoque=${produto.estoque}">
                        Adicionar ao carrinho
                    </button>

                </article>
            </div>

            <!-- Mensagem caso nenhum produto corresponda aos filtros -->
            <p class="sem-produtos"
               th:if="${#lists.isEmpty(produtos)}">
                Nenhum produto encontrado. Tente outra pesquisa ou categoria.
            </p>

        </section>
    </main>

    <footer th:replace="~{fragmento/rodape :: rodape}"></footer>

</body>
</html>
