<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="Css/cadastroUsuario.css">
</head>

<body>

    <div th:replace="~{fragmento/navbar :: navbar}"></div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">

        <div class="card cadastro-card shadow-lg p-4">

            <!-- Cabeçalho -->
            <div class="text-center mb-4">

                <h2 class="fw-bold text-dark"
                    th:text="${usuario.id == null
                        ? 'Criar sua conta'
                        : 'Editar usuário'}">
                    Criar sua conta
                </h2>

                <p class="text-muted mb-0"
                   th:if="${usuario.id == null}">
                    Preencha seus dados para realizar o cadastro
                </p>

                <p class="text-muted mb-0"
                   th:if="${usuario.id != null}">
                    Atualize as informações do usuário
                </p>

            </div>

            <!-- Formulário -->
            <form th:action="${modoAdmin}
                    ? @{/usuario/salvar}
                    : @{/cliente/salvar}"
                  th:object="${usuario}"
                  method="post">

                <!-- ID oculto para edição -->
                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <!-- Nome -->
                    <div class="col-12 mb-3">

                        <label for="nome" class="form-label fw-semibold">
                            Nome completo
                            <span class="campo-obrigatorio">*</span>
                        </label>

                        <input type="text"
                               th:field="*{nome}"
                               class="form-control"
                               id="nome"
                               placeholder="Digite seu nome completo"
                               autocomplete="name"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}">
                        </div>

                    </div>

                    <!-- CPF -->
                    <div class="col-md-6 mb-3">

                        <label for="cpf" class="form-label fw-semibold">
                            CPF
                            <span class="campo-obrigatorio">*</span>
                        </label>

                        <input type="text"
                               th:field="*{cpf}"
                               class="form-control"
                               id="cpf"
                               placeholder="000.000.000-00"
                               inputmode="numeric"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('cpf')}"
                             th:errors="*{cpf}">
                        </div>

                    </div>

                    <!-- Telefone -->
                    <div class="col-md-6 mb-3">

                        <label for="telefone" class="form-label fw-semibold">
                            Telefone
                            <span class="campo-obrigatorio">*</span>
                        </label>

                        <input type="tel"
                               th:field="*{telefone}"
                               class="form-control"
                               id="telefone"
                               placeholder="(67) 99999-9999"
                               autocomplete="tel"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('telefone')}"
                             th:errors="*{telefone}">
                        </div>

                    </div>

                    <!-- E-mail -->
                    <div class="col-12 mb-3">

                        <label for="email" class="form-label fw-semibold">
                            E-mail
                            <span class="campo-obrigatorio">*</span>
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               id="email"
                               placeholder="nome@exemplo.com"
                               autocomplete="email"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- Senha -->
                    <div class="col-12 mb-3">

                        <label for="senha" class="form-label fw-semibold">
                            Senha
                            <span class="campo-obrigatorio">*</span>
                        </label>

                        <input type="password"
                               th:field="*{senha}"
                               class="form-control"
                               id="senha"
                               placeholder="Crie uma senha"
                               autocomplete="new-password"
                               th:required="${usuario.id == null}">

                        <div class="form-text"
                             th:if="${usuario.id != null}">
                            Deixe em branco somente se sua aplicação
                            permitir manter a senha atual.
                        </div>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('senha')}"
                             th:errors="*{senha}">
                        </div>

                    </div>

                    <!-- Opções administrativas -->
                    <div class="col-12" th:if="${modoAdmin}">

                        <hr class="my-3">

                        <h5 class="fw-bold text-dark mb-3">
                            Configurações do usuário
                        </h5>

                        <!-- Ativo -->
                        <div class="form-check mb-3">

                            <input type="checkbox"
                                   th:field="*{ativo}"
                                   class="form-check-input"
                                   id="ativo">

                            <label for="ativo" class="form-check-label">
                                Usuário ativo
                            </label>

                        </div>

                        <!-- Tipo de usuário -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Tipo de usuário
                            </label>

                            <div class="form-check">
                                <input type="radio"
                                       th:field="*{tipoUsuario}"
                                       class="form-check-input"
                                       id="tipoCliente"
                                       value="CLIENTE">

                                <label for="tipoCliente"
                                       class="form-check-label">
                                    Cliente
                                </label>
                            </div>

                            <div class="form-check">
                                <input type="radio"
                                       th:field="*{tipoUsuario}"
                                       class="form-check-input"
                                       id="tipoAdministrador"
                                       value="ADMINISTRADOR">

                                <label for="tipoAdministrador"
                                       class="form-check-label">
                                    Administrador
                                </label>
                            </div>

                            <div class="form-check">
                                <input type="radio"
                                       th:field="*{tipoUsuario}"
                                       class="form-check-input"
                                       id="tipoFuncionario"
                                       value="FUNCIONARIO">

                                <label for="tipoFuncionario"
                                       class="form-check-label">
                                    Funcionário
                                </label>
                            </div>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('tipoUsuario')}"
                                 th:errors="*{tipoUsuario}">
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Mensagem de erro geral, se houver -->
                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">

                    <p class="mb-0"
                       th:each="erro : ${#fields.globalErrors()}"
                       th:text="${erro}">
                    </p>

                </div>

                <!-- Botões -->
                <div class="d-grid gap-2 mt-3">

                    <button type="submit"
                            class="btn btn-primary fw-bold py-2"
                            th:text="${usuario.id == null
                                ? 'Criar conta'
                                : 'Salvar alterações'}">
                        Criar conta
                    </button>

                </div>

                <!-- Links inferiores -->
                <div class="text-center mt-4">

                    <a th:if="${!modoAdmin}"
                       th:href="@{/login}"
                       class="text-decoration-none small text-primary">
                        Já tem uma conta? Faça login
                    </a>

                    <a th:if="${modoAdmin}"
                       th:href="@{/usuarios}"
                       class="text-decoration-none small text-primary">
                        Voltar para a lista de usuários
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
