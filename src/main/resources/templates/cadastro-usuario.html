<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastro de usuário</title>
</head>
<body>
<main class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h1 class="h3 mb-0"
                th:text="${modoAdmin ? (usuario.id == null ? 'Cadastrar novo usuário' : 'Editar usuário') : 'Criar minha conta'}">
                Cadastro
            </h1>
        </div>

        <div class="card-body">
            <form th:action="${modoAdmin} ? @{/usuario/salvar} : @{/cadastro/salvar}"
                  th:object="${usuario}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo:</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control">
                    <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></div>
                </div>

                <div class="mb-3">
                    <label for="cpf" class="form-label">CPF:</label>
                    <input type="text" id="cpf" th:field="*{cpf}" class="form-control">
                    <div th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-danger"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="text" id="email" th:field="*{email}" class="form-control">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="text" id="telefone" th:field="*{telefone}" class="form-control">
                    <div th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="text-danger"></div>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label"
                           th:text="${usuario.id == null} ? 'Senha:' : 'Nova senha (deixe em branco para manter a atual):'">Senha:</label>
                    <input type="password" id="senha" th:field="*{senha}" class="form-control" autocomplete="new-password">
                    <div th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="text-danger"></div>
                </div>

                <!-- Só o ADMINISTRADOR vê e altera estes campos -->
                <div th:if="${modoAdmin}">
                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                        <label class="form-check-label" for="ativo">Usuário ativo</label>
                    </div>

                    <div class="mb-3">
                        <label for="dataCadastro" class="form-label">Data do cadastro:</label>
                        <input type="date" id="dataCadastro" th:field="*{dataCadastro}" class="form-control">
                        <div th:if="${#fields.hasErrors('dataCadastro')}" th:errors="*{dataCadastro}" class="text-danger"></div>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="form-label fs-6">Tipo de usuário:</legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="tipo-cliente" th:field="*{tipoUsuario}" value="CLIENTE">
                            <label class="form-check-label" for="tipo-cliente">Cliente</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="tipo-admin" th:field="*{tipoUsuario}" value="ADMINISTRADOR">
                            <label class="form-check-label" for="tipo-admin">Administrador</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="tipo-func" th:field="*{tipoUsuario}" value="FUNCIONARIO">
                            <label class="form-check-label" for="tipo-func">Funcionário</label>
                        </div>
                        <div th:if="${#fields.hasErrors('tipoUsuario')}" th:errors="*{tipoUsuario}" class="text-danger"></div>
                    </fieldset>
                </div>

                <!-- No cadastro público estes valores são só para passar na validação.
                     O servidor ignora e define: tipo CLIENTE, ativo, data de hoje. -->
                <div th:unless="${modoAdmin}">
                    <input type="hidden" name="tipoUsuario" value="CLIENTE">
                    <input type="hidden" name="dataCadastro" value="2000-01-01">
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-primary"
                            th:text="${modoAdmin} ? 'Salvar usuário' : 'Criar minha conta'">Salvar</button>
                    <a th:href="${modoAdmin} ? @{/usuarios} : @{/login}" class="btn btn-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
