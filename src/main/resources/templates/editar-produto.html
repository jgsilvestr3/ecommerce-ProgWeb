<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <th:block th:replace="~{fragmento/tema-inicial :: tema-inicial}"></th:block>

    <title>Editar produto - ShopHub</title>

    <link rel="stylesheet" th:href="@{/css/shophub.css}">
</head>

<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">

    <header th:replace="~{fragmento/navbar :: navbar}"></header>

    <main id="conteudo" class="sh-conteudo-admin sh-editar-produto">
        <div class="sh-editar-produto__painel">

            <a class="sh-editar-produto__voltar" th:href="@{/admin/produtos}">
                ← Voltar aos produtos
            </a>

            <h1>Editar produto</h1>

            <div th:if="${erro}"
                 class="sh-editar-produto__erro"
                 th:text="${erro}">
            </div>

            <form th:action="@{/admin/produtos/atualizar/{id}(id=${produto.id})}"
                  method="post">

                <div class="sh-editar-produto__campo">
                    <label for="nome">Nome do produto</label>

                    <input type="text"
                           id="nome"
                           name="nome"
                           th:value="${produto.nome}"
                           maxlength="255"
                           required>
                </div>

                <div class="sh-editar-produto__campo">
                    <label for="descricao">Descrição</label>

                    <textarea id="descricao"
                              name="descricao"
                              rows="3"
                              maxlength="2000"
                              required
                              th:text="${produto.descricao}"></textarea>
                </div>

                <div class="sh-editar-produto__campo">
                    <label for="preco">Preço (R$)</label>

                    <input type="number"
                           id="preco"
                           name="preco"
                           min="0.01"
                           step="0.01"
                           th:value="${produto.preco}"
                           required>
                </div>

                <div class="sh-editar-produto__campo">
                    <label for="estoque">Quantidade em estoque</label>

                    <input type="number"
                           id="estoque"
                           name="estoque"
                           min="0"
                           step="1"
                           th:value="${produto.estoque}"
                           required>
                </div>

                <div class="sh-editar-produto__campo">
                    <label for="imagem">Caminho da imagem</label>

                    <input type="text"
                           id="imagem"
                           name="imagem"
                           maxlength="255"
                           th:value="${produto.imagem}"
                           placeholder="/images/produtos/notebook.jpg">

                    <small>
                        Informe um novo caminho para alterar a imagem.
                        Se deixar em branco, a imagem atual será mantida.
                    </small>

                    <img class="sh-editar-produto__imagem-preview"
                         th:if="${#strings.isEmpty(produto.imagem)}"
                         th:src="@{/images/produtos/sem-imagem.svg}"
                         th:alt="${produto.nome}">

                    <img class="sh-editar-produto__imagem-preview"
                         th:unless="${#strings.isEmpty(produto.imagem)}"
                         th:src="@{${produto.imagem}}"
                         th:alt="${produto.nome}"
                         onerror="this.onerror=null;this.src='/images/produtos/sem-imagem.svg'">
                </div>

                <div class="sh-editar-produto__campo">
                    <label for="categoriaId">Categoria</label>

                    <select id="categoriaId" name="categoriaId">
                        <option value="">Sem categoria</option>

                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nome}"
                                th:selected="${produto.categoria != null and produto.categoria.id == categoria.id}">
                            Categoria
                        </option>
                    </select>
                </div>

                <button type="submit" class="sh-editar-produto__salvar">
                    Salvar alterações
                </button>

            </form>
        </div>
    </main>

    <footer th:replace="~{fragmento/rodape :: rodape}"></footer>

</body>
</html>
