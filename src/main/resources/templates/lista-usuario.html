<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragmento/navbar :: navbar}"></div>

    <div class="container mt-5">

        <h2 class="mb-4">Usuários do Sistema</h2>

        <table class="table table-striped table-hover table-bordered">

            <thead class="table-dark">
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Situação</th>
                    <th>Senha</th>
                    <th>Data do Cadastro</th>
                    <th>Tipo</th>
                    <th></th>
                </tr>

            </thead>
            <!-- id nome cpf email telefone ativo senha dataCadastro tipoUsuario; -->

            <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.nome}"></td>
                    <td th:text="${usuario.cpf}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.telefone}"></td>
                    <td th:text="${usuario.ativo}"></td>
                    <td th:text="${usuario.senha}"></td>
                    <td th:text="${usuario.dataCadastro}"></td>
                    <td th:text="${usuario.tipoUsuario}"></td>

                    <td>

                        <!-- Editar -->
                        <a th:href="@{/usuario/editar/{id}(id=${usuario.id})}"
                        class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <!-- Excluir -->
                        <a th:href="@{/usuario/excluir/{id}(id=${usuario.id})}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Deseja realmente excluir este usuário?');">
                            Excluir
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="4" class="text-center">
                        Nenhum usuário cadastrado até o momento.
                    </td>
                </tr>

            </tbody>

        </table>

        <a th:href="@{/novo/usuario}"
        class="btn btn-primary">
            Cadastrar Novo Usuário
        </a>

    </div>

</body>
</html>
