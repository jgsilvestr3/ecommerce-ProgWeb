<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <th:block th:replace="~{fragmento/tema-inicial :: tema-inicial}"></th:block>

    <title>Gerenciar categorias - ShopHub</title>

    <link rel="stylesheet" th:href="@{/css/shophub.css}">
</head>

<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">

    <header th:replace="~{fragmento/navbar :: navbar}"></header>

    <main id="conteudo" class="sh-conteudo-admin sh-admin-categorias">
        <div class="sh-admin-categorias__painel">

            <a class="sh-admin-categorias__voltar" th:href="@{/}">
                ← Voltar à loja
            </a>

            <h1>Gerenciar categorias</h1>

            <p>Cadastre e consulte as categorias dos produtos da ShopHub.</p>

            <div th:if="${sucesso}"
                 class="sh-admin-categorias__mensagem sh-admin-categorias__sucesso"
                 th:text="${sucesso}">
            </div>

            <div th:if="${erro}"
                 class="sh-admin-categorias__mensagem sh-admin-categorias__erro"
                 th:text="${erro}">
            </div>

            <h2>Nova categoria</h2>

            <form class="sh-admin-categorias__cadastro"
                  th:action="@{/admin/categorias/salvar}"
                  method="post">

                <input aria-label="Nome da nova categoria"
                       type="text"
                       name="nome"
                       placeholder="Nome da categoria"
                       maxlength="255"
                       required>

                <button type="submit" class="sh-admin-categorias__salvar">
                    Cadastrar
                </button>
            </form>

            <h2>Categorias cadastradas</h2>

            <div class="sh-admin-categorias__tabela-wrapper">
                <table class="sh-admin-categorias__tabela">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="categoria : ${categorias}">
                            <td th:text="${categoria.id}">1</td>
                            <td th:text="${categoria.nome}">Roupas</td>

                            <td>
                                <form th:action="@{/admin/categorias/excluir/{id}(id=${categoria.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="sh-admin-categorias__excluir"
                                            onclick="return confirm('Deseja excluir esta categoria?')">
                                        Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="3"
                                class="sh-admin-categorias__vazio">
                                Nenhuma categoria cadastrada.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragmento/rodape :: rodape}"></footer>

</body>
</html>
