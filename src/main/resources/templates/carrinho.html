<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/shophub.css}">
    <title>Carrinho | ShopHub</title>
</head>
<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">
<header th:replace="~{fragmento/navbar :: navbar}"></header>

<main id="conteudo" class="container py-4">
    <h1 class="h3 mb-2">Seu carrinho</h1>
    <p class="text-body-secondary small">
        O carrinho fica salvo no seu navegador e continua aqui mesmo se você fechar a página.
    </p>

    <div id="carrinho-vazio" class="alert alert-info d-none" role="status">
        Seu carrinho está vazio. <a th:href="@{/}">Ver produtos</a>
    </div>

    <div id="carrinho-conteudo" class="d-none">
        <div class="table-responsive">
            <table class="table align-middle">
                <caption class="visually-hidden">Itens do carrinho</caption>
                <thead>
                    <tr>
                        <th scope="col">Produto</th>
                        <th scope="col">Preço</th>
                        <th scope="col">Quantidade</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col"><span class="visually-hidden">Ações</span></th>
                    </tr>
                </thead>
                <tbody id="carrinho-itens"></tbody>
            </table>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <button type="button" id="btn-limpar" class="btn btn-outline-secondary">Esvaziar carrinho</button>
            <div class="text-end">
                <p class="mb-2 fs-5">Total: <strong id="carrinho-total">R$ 0,00</strong></p>
                <a class="btn btn-primary" th:href="@{/checkout}">Finalizar compra</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragmento/rodape :: rodape}"></footer>
</body>
</html>
