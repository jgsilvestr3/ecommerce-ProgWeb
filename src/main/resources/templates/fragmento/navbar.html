<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
</head>
<body>
    <!-- Menu único do ShopHub: aparece em todas as telas e muda conforme o perfil de quem está logado -->
    <header th:fragment="navbar" class="sh-header">
        <a class="sh-skip" href="#conteudo">Pular para o conteúdo</a>

        <nav class="sh-nav" aria-label="Navegação principal">
            <a class="sh-logo" th:href="@{/}">ShopHub</a>

            <ul class="sh-menu">
                <li><a th:href="@{/}">Início</a></li>

                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/meus-pedidos}">Meus pedidos</a>
                </li>

                <li sec:authorize="hasAnyRole('ADMINISTRADOR', 'FUNCIONARIO')">
                    <a th:href="@{/admin/produtos}">Gerenciar produtos</a>
                </li>

                <li sec:authorize="hasRole('ADMINISTRADOR')">
                    <a th:href="@{/admin/categorias}">Categorias</a>
                </li>

                <li sec:authorize="hasRole('ADMINISTRADOR')">
                    <a th:href="@{/usuarios}">Usuários</a>
                </li>

                <li>
                    <a th:href="@{/carrinho}">
                        <span aria-hidden="true">🛒</span> Carrinho
                        <span class="sh-badge" id="contador-carrinho">0</span>
                        <span class="sh-oculto"> itens no carrinho</span>
                    </a>
                </li>

                <li sec:authorize="isAnonymous()">
                    <a th:href="@{/login}">Entrar</a>
                </li>

                <li sec:authorize="isAnonymous()">
                    <a class="sh-botao" th:href="@{/cadastro}">Cadastrar</a>
                </li>

                <li sec:authorize="isAuthenticated()"
                    class="sh-usuario"
                    sec:authentication="name">
                </li>

                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="sh-sair">Sair</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

</body>
</html>
