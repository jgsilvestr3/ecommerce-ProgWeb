<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div th:replace="~{fragmento/navbar :: navbar}"></div>

    <div class="container-sm">

        <div class="card cadastro-card shadow-lg p-4">

            <div class="mb-3"> 

                <form th:action=@{/admin/produtos/salvar} th:object="${produto}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <label class="form-label fw-semibold">Nome: </label>
                    <input type="text" th:field="*{nome}" class="form-control" placeholder="Nome do produto" required>
                    
                    <label class="form-label fw-semibold">Descrição: </label>
                    <input type="text" th:field="*{descricao}" class="form-control" placeholder="Descrição" required>
                    
                    <label class="form-label fw-semibold">Preço: </label>
                    <input type="number" inputmode="decimal" th:field="*{preco}" class="form-control" required>

                    <label class="form-label fw-semibold">Estoque: </label>
                    <input type="number" th:field="*{estoque}" class="form-control" required>


                    <button type="submit" class="btn btn-primary">Salvar produto</button>

                </form>

            </div>
        </div>
    </div>
</body>
</html>
