<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/shophub.css}">
    <title>Meus pedidos | ShopHub</title>
</head>
<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">
<header th:replace="~{fragmento/navbar :: navbar}"></header>

<main id="conteudo" class="container py-4">
    <h1 class="h3 mb-3">Meus pedidos</h1>

    <div class="alert alert-info" role="status" th:if="${#lists.isEmpty(pedidos)}">
        Você ainda não fez nenhum pedido. <a th:href="@{/}">Ver produtos</a>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(pedidos)}">
        <table class="table align-middle">
            <caption class="visually-hidden">Lista dos seus pedidos</caption>
            <thead>
                <tr>
                    <th scope="col">Pedido</th>
                    <th scope="col">Data</th>
                    <th scope="col">Total</th>
                    <th scope="col">Situação</th>
                    <th scope="col"><span class="visually-hidden">Detalhes</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pedidos}">
                    <td th:text="${'#' + p.id}">#1</td>
                    <td th:text="${p.dataHoraFormatada}">01/01/2026 10:00</td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                    <td>
                        <span class="badge" th:classappend="${p.pago} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${p.pago} ? 'Pago' : 'Recusado'">Pago</span>
                    </td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{/pedido/{id}(id=${p.id})}">Ver detalhes</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmento/rodape :: rodape}"></footer>
</body>
</html>
