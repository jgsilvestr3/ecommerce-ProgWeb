<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Produtos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>
    <header>
        <div th:replace="~{fragmento/navbar :: navbar}"></div>
    </header>

    <main class="container py-4">
        <h1 class="h3 mb-3">Produtos (página de teste do carrinho)</h1>
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-lg-4" th:each="p : ${produtos}">
                <article class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <h2 class="h5 card-title" th:text="${p.nome}">Nome</h2>
                        <p class="card-text text-body-secondary flex-grow-1" th:text="${p.descricao}">Descrição</p>
                        <p class="fw-semibold fs-5 mb-1"
                        th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                        <p class="small mb-2"
                        th:text="${p.estoque == 0} ? 'Esgotado' : |${p.estoque} em estoque|">Estoque</p>
                        <button type="button" class="btn btn-primary btn-add-carrinho"
                                th:disabled="${p.estoque == 0}"
                                th:attr="data-id=${p.id},data-nome=${p.nome},data-preco=${p.preco},data-estoque=${p.estoque}">
                            Adicionar ao carrinho
                        </button>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <script th:src="@{/js/carrinho.js}"></script>
</body>
</html>
