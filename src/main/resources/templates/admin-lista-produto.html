<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Lista de Produtos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div th:replace="~{fragmento/navbar :: navbar}"></div>

    <div class="container">
        <table class="table table-striped table-hover table-bordered">

            <thead class="table-dark">
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th></th>
                </tr>

            </thead>
            <!-- id nome cpf email telefone ativo senha dataCadastro tipoproduto; -->

            <tbody>

                <tr th:each="produto : ${produtos}">

                    <td th:text="${produto.id}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.descricao}"></td>
                    <td th:text="${produto.preco}"></td>
                    <td th:text="${produto.estoque}"></td>

                    <td>

                        <!-- Editar -->
                        <a th:href="@{/admin/produtos/editar/{id}(id=${produto.id})}"
                        class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <!-- Excluir -->
                        <a th:href="@{/admin/produtos/excluir/{id}(id=${produto.id})}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Deseja realmente excluir este usuário?');">
                            Excluir
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="4" class="text-center">
                        Nenhum usuário cadastrado até o momento.
                    </td>
                </tr>

            </tbody>

        </table>

        <a th:href="@{/produtos/novo}" class="btn btn-primary">
            Cadastrar novo produto
        </a>
    </div>

    <script th:src="@{/js/carrinho.js}"></script>
</body>
</html>
