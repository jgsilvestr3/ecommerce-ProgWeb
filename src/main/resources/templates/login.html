<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
 <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card shadow-lg p-4 justify-content-center" style="width: 100%; max-width: 400px; border-radius: 15px;">
            
            <!-- Cabeçalho do Card -->
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">Bem-vindo</h2>
                <p class="text-muted">Faça login para acessar sua conta</p>
            </div>

            <!-- Formulário -->
            <form th:action="@{/login}" method="post">
                <!-- Campo de E-mail -->
                <div class="mb-3">
                    <label>E-mail</label>
                    <input type="email" class="form-index form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
                </div>

                <!-- Campo de Senha -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label>Senha</label>
                        <a href="#" class="text-decoration-none small text-primary">Esqueceu a senha?</a>
                    </div>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
                </div>

                <!-- tratamento de senha usuario errado --> 
                <p th:if="${param.error}">
                    Usuário ou senha inválidos.
                </p>        

                <!-- Checkbox Lembrar-me -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input">
                    <label>Lembrar-me neste dispositivo</label>
                </div>

                <!-- Botão de Login -->
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary fw-bold py-2">Entrar</button>
                </div>

                <!-- Link de Registro -->
                <div class="text-center">
                    <span class="text-muted small">Não tem uma conta?</span>
                    <a href="#" class="text-decoration-none small fw-bold text-primary">Cadastre-se</a>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
