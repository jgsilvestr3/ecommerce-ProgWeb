<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | ShopHub</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/shophub.css}">
</head>
<body class="sh-pagina" th:attr="data-usuario=${emailLogado}">
<header th:replace="~{fragmento/navbar :: navbar}"></header>

<main id="conteudo" class="sh-centro">
    <div class="card sh-card-form p-4">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold">Bem-vindo de volta</h1>
            <p class="text-muted mb-0">Entre para acompanhar seus pedidos e finalizar compras</p>
        </div>

        <div class="alert alert-danger" role="alert" th:if="${param.error}">Usuário ou senha inválidos.</div>
        <div class="alert alert-success" role="status" th:if="${param.logout}">Você saiu da sua conta.</div>
        <div class="alert alert-success" role="status" th:if="${param.cadastrado}">Conta criada! Entre com o seu e-mail e a sua senha.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="nome@exemplo.com" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Sua senha" autocomplete="current-password" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary fw-bold py-2">Entrar</button>
            </div>
            <p class="text-center small mb-0">Não tem uma conta? <a th:href="@{/cadastro}" class="fw-bold">Cadastre-se</a></p>
        </form>
    </div>
</main>

<footer th:replace="~{fragmento/rodape :: rodape}"></footer>
</body>
</html>
