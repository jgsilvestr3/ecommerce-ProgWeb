<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Meus pedidos</title>
</head>
<body>
<header>
    <nav class="navbar navbar-dark bg-dark" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Loja</a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" th:href="@{/teste/produtos}">Produtos</a>
                <a class="btn btn-outline-light btn-sm" th:href="@{/carrinho}">
                    Carrinho <span class="badge text-bg-primary" id="contador-carrinho">0</span>
                </a>
            </div>
        </div>
    </nav>
</header>

<main class="container py-4">
    <h1 class="h3 mb-3">Meus pedidos</h1>

    <div class="alert alert-info" role="status" th:if="${#lists.isEmpty(pedidos)}">
        Você ainda não fez nenhum pedido. <a th:href="@{/teste/produtos}">Ver produtos</a>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(pedidos)}">
        <table class="table align-middle">
            <caption class="visually-hidden">Lista dos seus pedidos</caption>
            <thead>
                <tr>
                    <th scope="col">Pedido</th>
                    <th scope="col">Data</th>
                    <th scope="col">Total</th>
                    <th scope="col">Situação</th>
                    <th scope="col"><span class="visually-hidden">Detalhes</span></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pedidos}">
                    <td th:text="${'#' + p.id}">#1</td>
                    <td th:text="${p.dataHoraFormatada}">01/01/2026 10:00</td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                    <td>
                        <span class="badge" th:classappend="${p.pago} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${p.pago} ? 'Pago' : 'Recusado'">Pago</span>
                    </td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{/pedido/{id}(id=${p.id})}">Ver detalhes</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:src="@{/js/carrinho.js}"></script>
</body>
</html>
